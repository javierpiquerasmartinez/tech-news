<!doctype html>
<!-- Infografía: tabla comparativa a pantalla completa. Las filas aparecen al ritmo de `tiempos`
     (segundos desde el inicio del Gráfico); `destacar` = índice de fila resaltada en lima. -->
<html data-composition-variables='[{"id":"datos","type":"string","label":"JSON","default":"{\"titulo\":\"Precio por millón de tokens\",\"columnas\":[\"Modelo\",\"Entrada\",\"Salida\"],\"filas\":[[\"GPT-6.2 Astra\",\"8 $\",\"40 $\"],[\"Claude Fable 5.2\",\"8 $\",\"40 $\"],[\"Gemini 4 Neon\",\"3 $\",\"15 $\"]],\"destacar\":2,\"tiempos\":[]}"}]'>
<head><meta charset="utf-8"><link rel="stylesheet" href="comun.css">
<style>
.tabla { position: absolute; left: var(--margen); top: 230px; width: 1340px; border-collapse: separate; border-spacing: 0 14px;
         font-size: 44px; }
.tabla th { text-align: left; font-size: 26px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
            color: var(--gris); padding: 0 32px; }
.tabla td { background: var(--noche-2); padding: 26px 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tabla td:first-child { border-radius: var(--radio) 0 0 var(--radio); }
.tabla td:last-child { border-radius: 0 var(--radio) var(--radio) 0; }
.tabla td + td { color: var(--gris); }
.tabla tr.top td { background: var(--acento); color: var(--noche); }
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DURACION__">
  <div class="lienzo"></div>
  <div class="titulo-pantalla" id="tit"></div>
  <table class="tabla" id="tabla"><thead><tr id="cab"></tr></thead><tbody id="cuerpo"></tbody></table>
  <div class="hueco-circulo"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const d = JSON.parse(window.__hyperframes.getVariables().datos);
const D = __DURACION__;
document.getElementById("tit").textContent = d.titulo;
for (const c of d.columnas) { const th = document.createElement("th"); th.textContent = c; document.getElementById("cab").appendChild(th); }
d.filas.forEach((f, i) => {
  const tr = document.createElement("tr"); tr.className = "fila" + (i === d.destacar ? " top" : "");
  for (const c of f) { const td = document.createElement("td"); td.textContent = c; tr.appendChild(td); }
  document.getElementById("cuerpo").appendChild(tr);
});
const n = d.filas.length;
const tiempos = (d.tiempos && d.tiempos.length === n) ? d.tiempos
  : d.filas.map((_, i) => 0.6 + i * Math.min(1.2, (D * 0.6) / Math.max(n, 1)));
const tl = gsap.timeline({ paused: true });
tl.fromTo(".lienzo", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0)
  .fromTo("#tit", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15)
  .fromTo("thead", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.35)
  .fromTo(".hueco-circulo", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
document.querySelectorAll(".fila").forEach((tr, i) =>
  tl.fromTo(tr, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, tiempos[i]));
tl.to("#root > *", { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script>
</body></html>
