<!doctype html>
<!-- Captura de fuente: la página original en una tarjeta con zoom lento, la fuente debajo y,
     si hay `cita`, la frase clave en un recuadro lima. `imagen` es un PNG junto a este HTML. -->
<html data-composition-variables='[{"id":"datos","type":"string","label":"JSON","default":"{\"imagen\":\"captura.png\",\"fuente\":\"wiz.io\",\"cita\":\"Dos fallos que permiten ejecutar código sin autenticación\"}"}]'>
<head><meta charset="utf-8"><link rel="stylesheet" href="comun.css">
<style>
.marco { position: absolute; left: var(--margen); top: 70px; width: 1380px; height: 820px; border-radius: 22px; overflow: hidden;
         background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.barra { height: 46px; background: #E9ECF1; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
.barra i { width: 14px; height: 14px; border-radius: 50%; background: #C8CDD6; display: block; }
.barra span { margin-left: 18px; font-size: 20px; color: #5B6472; }
.pagina { position: absolute; top: 46px; left: 0; width: 100%; transform-origin: 50% 0; }
.pagina img { width: 100%; display: block; }
.fuente { position: absolute; left: var(--margen); top: 918px; }
.cita { position: absolute; left: 380px; right: 420px; bottom: 210px; background: var(--acento); color: var(--noche);
        font-weight: 900; font-size: 48px; line-height: 1.15; padding: 26px 36px; border-radius: var(--radio);
        box-shadow: 0 20px 60px rgba(0,0,0,.45); }
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DURACION__">
  <div class="lienzo"></div>
  <div class="marco"><div class="barra"><i></i><i></i><i></i><span id="url"></span></div>
    <div class="pagina"><img id="img"></div></div>
  <div class="fuente etiqueta" id="fuente"></div>
  <div class="cita" id="cita"></div>
  <div class="hueco-circulo"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const d = JSON.parse(window.__hyperframes.getVariables().datos);
const D = __DURACION__;
document.getElementById("img").src = d.imagen;
document.getElementById("url").textContent = d.fuente;
document.getElementById("fuente").textContent = "Fuente · " + d.fuente;
const cita = document.getElementById("cita");
if (d.cita) cita.textContent = d.cita; else cita.remove();
const tl = gsap.timeline({ paused: true });
tl.fromTo(".lienzo", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0)
  .fromTo(".marco", { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.1)
  .fromTo(".pagina", { scale: 1 }, { scale: 1.12, duration: D, ease: "none" }, 0)
  .fromTo("#fuente", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4)
  .fromTo(".hueco-circulo", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
if (d.cita) tl.fromTo("#cita", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, Math.min(1.2, D * 0.3));
tl.to("#root > *", { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script>
</body></html>
