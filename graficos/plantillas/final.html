<!doctype html>
<!-- Pantalla final (~15 s): huecos para los elementos de pantalla final de YouTube
     (vídeo 16:9 a la izquierda, botón de suscripción redondo a la derecha) y el logo. -->
<html data-composition-variables='[{"id":"datos","type":"string","label":"JSON","default":"{\"texto\":\"Sigue aprendiendo\",\"lema\":\"Noticias DEV cada semana\"}"}]'>
<head><meta charset="utf-8"><link rel="stylesheet" href="comun.css">
<style>
.texto { position: absolute; left: 0; right: 0; top: 130px; text-align: center; font-size: 76px; font-weight: 900; letter-spacing: -0.02em; }
.lema { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font-size: 38px; color: var(--gris); }
.lema b { color: var(--acento); }
/* Elemento "vídeo" de YouTube: 16:9; elemento "suscribirse": círculo. Solo guías sutiles. */
.hueco-video { position: absolute; left: 260px; top: 380px; width: 800px; height: 450px; border-radius: 16px;
               border: 3px dashed rgba(248,246,243,.18); }
.hueco-sub { position: absolute; left: 1260px; top: 455px; width: 300px; height: 300px; border-radius: 50%;
             border: 3px dashed rgba(198,255,61,.35); }
.logo { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); width: 84px; height: 90px; }
.logo .jota { position: absolute; left: 0; top: 0; width: 32px; height: 90px; background: var(--blanco); border-radius: 0 0 0 32px; }
.logo .bola { position: absolute; left: 36px; top: 0; width: 48px; height: 48px; border-radius: 50%; background: var(--blanco); }
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DURACION__">
  <div class="lienzo"></div>
  <div class="texto" id="texto"></div>
  <div class="lema" id="lema"></div>
  <div class="hueco-video"></div><div class="hueco-sub"></div>
  <div class="logo"><div class="jota"></div><div class="bola"></div></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const d = JSON.parse(window.__hyperframes.getVariables().datos);
document.getElementById("texto").textContent = d.texto;
document.getElementById("lema").innerHTML = d.lema.replace(/</g, "&lt;").replace("DEV", "<b>DEV</b>");
const tl = gsap.timeline({ paused: true });
tl.fromTo(".lienzo", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0)
  .fromTo("#texto", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.2)
  .fromTo("#lema", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.45)
  .fromTo(".hueco-video, .hueco-sub", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out", stagger: 0.15 }, 0.6)
  .fromTo(".logo", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.9);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script>
</body></html>
