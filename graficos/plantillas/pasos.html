<!doctype html>
<!-- Infografía: pasos numerados ("qué hacer hoy") a pantalla completa, al ritmo de `tiempos`. -->
<html data-composition-variables='[{"id":"datos","type":"string","label":"JSON","default":"{\"titulo\":\"Qué hacer hoy\",\"pasos\":[\"Comprueba tu versión con nginx -V\",\"Actualiza a 1.30.7 o 1.31.9\",\"Si no puedes: http2 off;\"],\"tono\":\"dato\",\"tiempos\":[]}"}]'>
<head><meta charset="utf-8"><link rel="stylesheet" href="comun.css">
<style>
.pasos { position: absolute; left: var(--margen); top: 230px; width: 1380px; display: flex; flex-direction: column; gap: 24px; }
.paso { display: flex; align-items: center; gap: 32px; background: var(--noche-2); border-radius: var(--radio); padding: 26px 34px; }
.n { flex: none; width: 76px; height: 76px; border-radius: 50%; background: var(--tono); color: var(--noche);
     font-weight: 900; font-size: 40px; display: flex; align-items: center; justify-content: center; }
.t { font-size: 46px; font-weight: 700; line-height: 1.2; }
.t code { font-family: var(--mono); color: var(--tono); font-size: .9em; }
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DURACION__">
  <div class="lienzo"></div>
  <div class="titulo-pantalla" id="tit"></div>
  <div class="pasos" id="pasos"></div>
  <div class="hueco-circulo"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const d = JSON.parse(window.__hyperframes.getVariables().datos);
const D = __DURACION__;
document.getElementById("root").style.setProperty("--tono", d.tono === "alerta" ? "var(--alerta)" : "var(--acento)");
document.getElementById("tit").textContent = d.titulo;
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
d.pasos.forEach((p, i) => {
  const div = document.createElement("div"); div.className = "paso";
  // `texto entre comillas invertidas` se pinta como código
  div.innerHTML = `<div class="n">${i + 1}</div><div class="t">${esc(p).replace(/`([^`]+)`/g, "<code>$1</code>")}</div>`;
  document.getElementById("pasos").appendChild(div);
});
const n = d.pasos.length;
const tiempos = (d.tiempos && d.tiempos.length === n) ? d.tiempos
  : d.pasos.map((_, i) => 0.6 + i * Math.min(1.5, (D * 0.6) / Math.max(n, 1)));
const tl = gsap.timeline({ paused: true });
tl.fromTo(".lienzo", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0)
  .fromTo("#tit", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15)
  .fromTo(".hueco-circulo", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
document.querySelectorAll(".paso").forEach((el, i) =>
  tl.fromTo(el, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, tiempos[i]));
tl.to("#root > *", { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script>
</body></html>
