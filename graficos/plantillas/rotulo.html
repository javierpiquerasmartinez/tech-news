<!doctype html>
<!-- Rótulo de dato: cifra/versión/precio/CVE grande + etiqueta, lateral derecho inferior.
     tono: "dato" (lima) o "alerta" (rojo, solo seguridad). -->
<html data-composition-variables='[{"id":"datos","type":"string","label":"JSON","default":"{\"etiqueta\":\"Precio por millón de tokens\",\"valor\":\"8 $ / 40 $\",\"detalle\":\"entrada / salida\",\"tono\":\"dato\"}"}]'>
<head><meta charset="utf-8"><link rel="stylesheet" href="comun.css">
<style>
.rot { position: absolute; right: var(--margen); bottom: 120px; background: var(--noche); border-radius: var(--radio);
       padding: 26px 40px 30px; min-width: 420px; max-width: 760px; box-shadow: 0 10px 40px rgba(0,0,0,.35);
       border-left: 8px solid var(--tono); }
.val { font-weight: 900; font-size: 88px; line-height: 1; letter-spacing: -0.03em; color: var(--tono); margin-top: 10px; }
.det { font-size: 30px; color: var(--gris); margin-top: 10px; }
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DURACION__">
  <div class="rot" id="rot"><div class="etiqueta" id="eti"></div><div class="val" id="val"></div><div class="det" id="det"></div></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const d = JSON.parse(window.__hyperframes.getVariables().datos);
const D = __DURACION__;
document.getElementById("rot").style.setProperty("--tono", d.tono === "alerta" ? "var(--alerta)" : "var(--acento)");
document.getElementById("eti").textContent = d.etiqueta || "";
document.getElementById("val").textContent = d.valor;
document.getElementById("det").textContent = d.detalle || "";
if (d.valor.length > 14) document.getElementById("val").style.fontSize = "60px";
const tl = gsap.timeline({ paused: true });
tl.fromTo(".rot", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0)
  .fromTo("#val", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.15)
  .to(".rot", { opacity: 0, y: 20, duration: 0.3, ease: "power2.in" }, D - 0.35);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script>
</body></html>
