<!doctype html>
<!-- Sello de marca (~3 s): la J y el círculo del logo encajan, aparece «JP Dev» y el lema. -->
<html data-composition-variables='[{"id":"datos","type":"string","label":"JSON","default":"{\"lema\":\"Noticias DEV cada semana\"}"}]'>
<head><meta charset="utf-8"><link rel="stylesheet" href="comun.css">
<style>
.marca { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 56px; }
.logo { width: 280px; height: 300px; position: relative; }
.jota { position: absolute; left: 0; top: 0; width: 108px; height: 300px; background: var(--blanco);
        border-radius: 0 0 0 108px; transform-origin: 50% 0; }
.bola { position: absolute; left: 120px; top: 0; width: 160px; height: 160px; border-radius: 50%; background: var(--blanco); }
.textos .nombre { font-size: 130px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
.textos .lema { font-size: 44px; color: var(--gris); margin-top: 18px; }
.textos .lema b { color: var(--acento); font-weight: 900; }
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DURACION__">
  <div class="lienzo"></div>
  <div class="marca">
    <div class="logo"><div class="jota"></div><div class="bola"></div></div>
    <div class="textos"><div class="nombre">JP Dev</div><div class="lema" id="lema"></div></div>
  </div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const d = JSON.parse(window.__hyperframes.getVariables().datos);
const D = __DURACION__;
// «DEV» en lima: es la palabra que identifica el canal
document.getElementById("lema").innerHTML = d.lema.replace(/</g, "&lt;").replace("DEV", "<b>DEV</b>");
const tl = gsap.timeline({ paused: true });
tl.fromTo(".lienzo", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0)
  .fromTo(".jota", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 0.15)
  .fromTo(".bola", { x: 180, opacity: 0, scale: 0.6 }, { x: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 0.45)
  .fromTo(".nombre", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.8)
  .fromTo(".lema", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.05)
  .to("#root > *", { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.35);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script>
</body></html>
