# Catálogo de Fuentes de tech-news (docs/arnes.md §2).
# Añadir o quitar una Fuente no requiere tocar código.
#
# Campos:
#   id      identificador estable (no cambiar: los Items lo referencian)
#   nombre  nombre legible
#   grupo   tldr | rapidas | ia-oficial | dev-cloud | seguridad | profundidad
#   tipo    rss      → feed RSS/Atom (url)
#           tldr     → newsletter TLDR (slug); RSS como señal + HTML de cada edición
#           cisa-kev → JSON de vulnerabilidades explotadas de CISA (url)
#           explorador → sin feed: la recorre el Explorador, el Recolector la ignora
#   activa  false para pausarla sin borrarla
#   nota    opcional, por qué está así
#
# Accesos verificados el 2026-11-22: docs/research/fuentes.md

fuentes:
  # --- TLDR: base diaria curada ------------------------------------------
  - {id: tldr-tech, nombre: TLDR, grupo: tldr, tipo: tldr, slug: tech}
  - {id: tldr-ai, nombre: TLDR AI, grupo: tldr, tipo: tldr, slug: ai}
  - {id: tldr-dev, nombre: TLDR Dev, grupo: tldr, tipo: tldr, slug: dev}
  - {id: tldr-infosec, nombre: TLDR InfoSec, grupo: tldr, tipo: tldr, slug: infosec}
  - {id: tldr-devops, nombre: TLDR DevOps, grupo: tldr, tipo: tldr, slug: devops}
  - {id: tldr-data, nombre: TLDR Data, grupo: tldr, tipo: tldr, slug: data}

  # --- Rápidas: Historias bomba ------------------------------------------
  - {id: hn, nombre: "Hacker News (≥150 puntos)", grupo: rapidas, tipo: rss, url: "https://hnrss.org/newest?points=150"}
  - {id: techmeme, nombre: Techmeme, grupo: rapidas, tipo: rss, url: "https://www.techmeme.com/feed.xml"}
  - {id: simonwillison, nombre: Simon Willison, grupo: rapidas, tipo: rss, url: "https://simonwillison.net/atom/everything/"}

  # --- IA oficial: lanzamientos ------------------------------------------
  - {id: openai, nombre: OpenAI News, grupo: ia-oficial, tipo: rss, url: "https://openai.com/news/rss.xml"}
