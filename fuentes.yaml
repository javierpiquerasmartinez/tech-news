  - {id: deepmind, nombre: Google DeepMind, grupo: ia-oficial, tipo: rss, url: "https://deepmind.google/blog/rss.xml"}
  - {id: mistral, nombre: Mistral AI, grupo: ia-oficial, tipo: rss, url: "https://mistral.ai/news/rss"}
  - {id: huggingface, nombre: Hugging Face blog, grupo: ia-oficial, tipo: rss, url: "https://huggingface.co/blog/feed.xml"}
  - {id: anthropic, nombre: Anthropic News, grupo: ia-oficial, tipo: explorador, url: "https://www.anthropic.com/news", nota: "Sin RSS"}
  - {id: openai-api-changelog, nombre: OpenAI API changelog, grupo: ia-oficial, tipo: explorador, url: "https://developers.openai.com/api/docs/changelog", nota: "Sin RSS"}
  - {id: gemini-api-changelog, nombre: Gemini API changelog, grupo: ia-oficial, tipo: explorador, url: "https://aistudio.google.com/docs/changelog", nota: "Sin RSS"}

